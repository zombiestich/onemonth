<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>one month &#9825;</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="bg-stars" id="bgStars"></div>

<div id="app">

  <!-- ============ CALENDAR SCENE ============ -->
  <div class="scene active" id="calendarScene">
    <div class="stage" id="calendarStage">
      <img id="calendarImg" src="images/Page1.png" alt="August 2026 calendar">
      <button class="hotspot" id="threeHotspot" aria-label="Reveal the surprise"></button>
      <div class="glow" id="threeGlow"></div>
      <div class="press-label" id="pressLabel"><span class="arrow">&#8594;</span>press</div>
      <div class="particle-layer" id="particleLayer"></div>
    </div>
  </div>

  <!-- ============ CERTIFICATE SCENE ============ -->
  <div class="scene" id="certificateScene">
    <div class="stage" id="certificateStage">
      <img id="certImg" src="images/Page2.png" alt="Best girlfriend certificate">
      <canvas id="scratchCanvas" aria-label="Scratch to reveal"></canvas>
      <div class="confetti-layer" id="confettiLayer"></div>
    </div>
  </div>

</div>

<button id="replayBtn">Replay &#9733;</button>

<span class="sr-only" id="liveRegion" aria-live="polite"></span>

<script src="js/script.js"></script>
</body>
</html>
