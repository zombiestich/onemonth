<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101c2e" />
    <title>One Month Anniversary</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main
      class="experience"
      aria-label="Interactive one month anniversary card"
    >
      <div class="card-stage" id="cardStage">
        <!-- Calendar Page -->
        <section
          class="page-shell calendar-shell"
          id="calendarShell"
          aria-label="August calendar"
        >
          <img
            class="page-art"
            id="calendarImage"
            src="images/calendar.png"
            alt="August calendar with interactive hotspot"
          />
          <button
            class="calendar-hotspot"
            id="calendarHotspot"
            aria-label="Click to reveal certificate"
          ></button>
        </section>

        <!-- Certificate Page -->
        <section
          class="page-shell certificate-shell"
          id="certificateShell"
          aria-label="Anniversary certificate"
        >
          <img
            class="page-art"
            id="certificateImage"
            src="images/certificate.png"
            alt="Anniversary certificate"
          />
          <canvas
            class="scratch-canvas"
            id="scratchCanvas"
            aria-label="Scratch off the certificate"
          ></canvas>
        </section>
      </div>

      <!-- Transition Effects -->
      <div class="transition-field" id="transitionField" aria-hidden="true"></div>
      <div class="celebration-field" id="celebrationField" aria-hidden="true"></div>

      <!-- Replay Button -->
      <button class="replay" id="replayButton" aria-label="Replay animation">
        <span>↻</span>
        <span>Replay</span>
      </button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
